<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1C1310">
  <title>Appeler Ken Dresdell</title>
  <link rel="stylesheet" href="widget.css?v=1">
  <style>
    html, body { margin: 0; min-height: 100%; background: #1C1310; color: #F6EEDC;
      font: 400 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { display: grid; place-content: center; justify-items: center; gap: 10px; min-height: 100dvh; padding: 24px 16px;
      text-align: center; background: radial-gradient(120% 55% at 50% 0%, #3A2A21 0%, #1C1310 62%); }
    .who { display: grid; place-items: center; width: 104px; height: 104px; margin-bottom: 10px; border-radius: 50%;
      background: #251914; box-shadow: 0 0 0 1px rgb(227 166 59 / .55); color: #E3A63B; font: 700 36px/1 system-ui, sans-serif; }
    h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; }
    p { margin: 0 0 22px; color: #C9B9A3; }
    .dial { display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 28px; border-radius: 999px;
      background: #E3A63B; color: #2A1B14; font-weight: 700; font-size: 17px; text-decoration: none; }
    .dial svg { width: 22px; height: 22px; }
    .dial:focus-visible { outline: 2px solid #E3A63B; outline-offset: 4px; }
    noscript { margin-top: 16px; color: #C9B9A3; }
  </style>
</head>
<body>
  <main>
    <div class="who" aria-hidden="true">KD</div>
    <h1>Ken Dresdell</h1>
    <p>Old Man Tricks · appel par Internet, sans frais</p>
    <a class="dial" href="#" data-appel>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3.5h3l1.6 4-2 1.3a11 11 0 0 0 7.6 7.6l1.3-2 4 1.6v3a2 2 0 0 1-2 2A16.5 16.5 0 0 1 3 5.5a2 2 0 0 1 2-2Z"/></svg>
      Appeler
    </a>
    <noscript>Cette page a besoin de JavaScript pour appeler.</noscript>
  </main>
  <script src="widget.js?v=2"></script>
</body>
</html>
