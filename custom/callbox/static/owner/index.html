<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1C1310">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Appels">
  <title>Appels OMT</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="owner.css?v=1">
</head>
<body>
  <!-- Passcode -->
  <section class="view" id="login" hidden>
    <h1>Appels OMT</h1>
    <p class="muted">Entrez le code pour recevoir les appels du site sur ce téléphone.</p>
    <form id="login-form">
      <input id="code" type="password" inputmode="text" autocomplete="current-password" placeholder="Code" aria-label="Code" required>
      <button class="btn is-main" type="submit">Entrer</button>
      <p class="err" id="login-err" role="alert"></p>
    </form>
  </section>

  <!-- Ready: notifications and voicemail -->
  <section class="view" id="home" hidden>
    <h1>Appels OMT</h1>
    <p class="line"><span class="dot" id="dot"></span><span id="conn">Connexion…</span></p>

    <div class="box">
      <h2>Sonnerie</h2>
      <p id="push-state">…</p>
      <div class="row" id="push-btns">
        <button class="btn is-main" type="button" id="push-on" hidden>Activer les notifications</button>
        <button class="btn" type="button" id="push-test" hidden>Envoyer un test</button>
      </div>
      <p class="hint" id="push-hint" hidden></p>
    </div>

    <div class="box">
      <h2>Messages vocaux</h2>
      <ul class="vms" id="vms"></ul>
    </div>

    <div class="row" style="margin-top: 22px">
      <button class="btn" type="button" id="logout">Se déconnecter</button>
    </div>
  </section>

  <!-- Incoming call / live call -->
  <section class="view call" id="call" hidden>
    <div class="call-who">
      <div class="call-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </div>
      <p class="call-name">Client du site web</p>
      <p class="call-sub" id="call-status" role="status" aria-live="assertive">Appel entrant…</p>
      <p class="call-timer" id="call-timer"></p>
    </div>
    <div class="call-btns" id="ring-btns">
      <button class="round is-no" type="button" id="decline">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 14.6c4.6-4.1 12.2-4.1 16.8 0 .6.5.7 1.4.2 2l-1.3 1.6c-.4.5-1.1.6-1.7.4l-2.6-1a1.4 1.4 0 0 1-.9-1.3v-1.7a10 10 0 0 0-4.2 0v1.7c0 .6-.4 1.1-.9 1.3l-2.6 1c-.6.2-1.3.1-1.7-.4l-1.3-1.6c-.5-.6-.4-1.5.2-2Z"/></svg>
        Refuser
      </button>
      <button class="round is-yes" type="button" id="accept">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3.5h3l1.6 4-2 1.3a11 11 0 0 0 7.6 7.6l1.3-2 4 1.6v3a2 2 0 0 1-2 2A16.5 16.5 0 0 1 3 5.5a2 2 0 0 1 2-2Z"/></svg>
        Répondre
      </button>
    </div>
    <div class="call-btns" id="talk-btns" hidden>
      <button class="round" type="button" id="mute" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
        Muet
      </button>
      <button class="round is-no" type="button" id="hangup">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 14.6c4.6-4.1 12.2-4.1 16.8 0 .6.5.7 1.4.2 2l-1.3 1.6c-.4.5-1.1.6-1.7.4l-2.6-1a1.4 1.4 0 0 1-.9-1.3v-1.7a10 10 0 0 0-4.2 0v1.7c0 .6-.4 1.1-.9 1.3l-2.6 1c-.6.2-1.3.1-1.7-.4l-1.3-1.6c-.5-.6-.4-1.5.2-2Z"/></svg>
        Raccrocher
      </button>
    </div>
    <audio id="remote" autoplay playsinline></audio>
  </section>

  <script src="owner.js?v=2"></script>
</body>
</html>
